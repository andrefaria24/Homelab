services:
  hermes:
      image: nousresearch/hermes-agent:v2026.7.20
      ports:
        - 9119:9119
        - 8765:8765
      volumes:
        - type: bind
          source: ${DATA_DIR}
          target: /opt/data
      environment:
        HERMES_DASHBOARD: 1
        OPENAI_API_KEY: ${OPENAI_KEY}
      networks:
        - network
      deploy:
        mode: replicated
        replicas: 1

networks:
  network:
    driver: overlay
    attachable: true
