services:
  jenkins:
      image: "jenkins/jenkins:${JENKINS_VERSION}"
      ports:
        - 8081:8080
      volumes:
        - type: bind
          source: ${DOCKER_SWARM_STORAGE}/jenkins/data
          target: /var/jenkins_home
      networks:
        - network
      deploy:
        mode: replicated
        replicas: 1

networks:
  network:
    driver: overlay
    attachable: true
