services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.20
    command: ["gateway", "run"]
    ports:
      - "9119:9119"
      - "8642:8642"
    volumes:
      - type: bind
        source: ${DATA_DIR}
        target: /opt/data
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DASHBOARD_SECRET}
      OPENAI_API_KEY: ${OPENAI_KEY}
    networks:
      - network
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  network:
    driver: overlay
    attachable: true
