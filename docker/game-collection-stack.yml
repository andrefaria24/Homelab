services:
  game-collection:
    image: faria135/faria-game-collection:0.3.0
    ports:
      - "3002:3000"
    environment:
      DATABASE_PATH: /app/data/game-collection.db
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be configured in Portainer}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be configured in Portainer}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be configured in Portainer}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be configured in Portainer}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:?INITIAL_ADMIN_EMAILS must be configured in Portainer}
    volumes:
      - type: bind
        source: /var/lib/game-collection/data
        target: /app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/collection')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - network
      - proxy
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.game_collection == true

networks:
  network:
    driver: overlay
    attachable: true
  proxy:
    name: homelab-proxy
    external: true
