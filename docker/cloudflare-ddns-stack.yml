services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.17.1
    read_only: true
    cap_drop:
      - ALL
    environment:
      - CLOUDFLARE_API_TOKEN_FILE=/run/secrets/cloudflare_api_token
      # The apex holds the A record with the public IP; games.andrecfaria.com
      # and faria-plex.andrecfaria.com are CNAMEs pointing at it, so updating
      # the apex keeps every hostname current. DDNS cannot create an A record
      # for a name that already has a CNAME.
      - DOMAINS=andrecfaria.com
      - IP6_PROVIDER=none
      - UPDATE_CRON=0 */12 * * *
      - PROXIED=false
    secrets:
      - cloudflare_api_token
    networks:
      - network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 5
        window: 10m

networks:
  network:
    driver: overlay
    attachable: true

secrets:
  cloudflare_api_token:
    external: true
    name: cloudflare_api_token_v2
