services:
  pulse:
      image: rcourtman/pulse:5.1.36
      init: true
      stop_grace_period: 1m
      ports:
        - 7655:7655
      volumes:
        - type: bind
          # Pulse uses SQLite WAL files, which require local storage.
          source: /var/lib/pulse/data
          target: /data
      environment:
        - PULSE_AUTH_USER=${PULSE_AUTH_USER}
        - PULSE_AUTH_PASS=${PULSE_AUTH_PASS}
      healthcheck:
        test: ["CMD", "/docker-healthcheck.sh"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s
      networks:
        - network
      deploy:
        mode: replicated
        replicas: 1
        resources:
          limits:
            memory: 768M
          reservations:
            memory: 128M
        restart_policy:
          condition: on-failure
          delay: 30s
          max_attempts: 5
          window: 10m
        placement:
          constraints:
            - node.labels.pulse == true

networks:
  network:
    driver: overlay
    attachable: true
