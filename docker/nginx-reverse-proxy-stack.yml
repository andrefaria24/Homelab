services:
  nginx-reverse-proxy:
      image: "docker.io/jc21/nginx-proxy-manager:2.14.0"
      ports:
        - 80:80
        - 8181:81
        - 443:443
      volumes:
        - type: bind
          source: ${DATA_DIR}
          target: /data
        
        - type: bind
          source: ${CERTS_DIR}
          target: /etc/letsencrypt
      networks:
        - network
      deploy:
        mode: replicated
        replicas: 1

networks:
  network:
    driver: overlay
    attachable: true
