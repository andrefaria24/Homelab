services:
  convertx:
      image: "c4illin/convertx:main"
      ports:
        - 3000:3000
      volumes:
        - type: bind
          source: ${DATA_DIR}
          target: /app/data
      healthcheck:
        test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/healthcheck"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 30s
      networks:
        - network
      deploy:
        mode: replicated
        replicas: 1

networks:
  network:
    driver: overlay
    attachable: true
