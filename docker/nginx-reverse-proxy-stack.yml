services:
  nginx-reverse-proxy:
      image: "docker.io/jc21/nginx-proxy-manager:2.15.1"
      volumes:
        - type: bind
          source: ${DATA_DIR}
          target: /data
        
        - type: bind
          source: ${CERTS_DIR}
          target: /etc/letsencrypt
      healthcheck:
        test: ["CMD", "/usr/bin/check-health"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s
      networks:
        - network
        - proxy
      deploy:
        mode: replicated
        # NPM is started by ansible/nginx-reverse-proxy-standalone.yml.
        # Docker Engine 29.7.2 leaves stale Swarm ingress NAT rules for these
        # ports, so this stack must not publish or run a competing replica.
        replicas: 0

networks:
  network:
    driver: overlay
    attachable: true
  proxy:
    name: homelab-proxy
    external: true
