services:
  vault:
      image: "hashicorp/vault:2.0.1"
      ports:
        - 8200:8200
      entrypoint: vault server -config /vault/config/config.hcl
      cap_add:
        - IPC_LOCK
      volumes:
        - type: bind
          source: ${DATA_DIR}/vault/data
          target: /vault/data

        - type: bind
          source: ${DATA_DIR}/vault/logs
          target: /vault/logs

        - type: bind
          source: ${DATA_DIR}/vault/certs
          target: /certs
        
        - type: bind
          source: ${DATA_DIR}/vault/config/vault-config.hcl
          target: /vault/config/config.hcl

      networks:
        - network
      deploy:
        mode: replicated
        replicas: 1

networks:
  network:
    driver: overlay
    attachable: true
